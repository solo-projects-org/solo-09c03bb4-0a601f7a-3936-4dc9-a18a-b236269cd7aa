name: pg-restore-checker

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # host access for inspection; change if it conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot generator of the three sample backups (normal / slow / corrupt).
  seed:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      SLOW_ROWS: "2000000" # rows in the slow sample; raise for a slower restore
    volumes:
      - ./seed/generate_samples.sh:/generate_samples.sh:ro
      - samples:/samples
    command: ["bash", "/generate_samples.sh"]
    restart: "no"

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGMAINTDB: postgres
      SLOTS: "2"            # max concurrent trial-restore batches
      DATA_DIR: /data
      SAMPLES_DIR: /samples
      MAX_UPLOAD_MB: "1024"
      JOB_TIMEOUT_S: "1800"
    volumes:
      - appdata:/data       # job history (SQLite) + uploads
      - samples:/samples:ro # sample backups generated by the seed service
    ports:
      - "8080:8000"

volumes:
  pgdata:
  appdata:
  samples:
